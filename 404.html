<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Urban Matter">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <title>404 - Page Not Found | Urban Matter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: clamp(80px, 20vw, 180px);
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            line-height: 1;
        }

        h1 {
            font-size: clamp(24px, 5vw, 36px);
            margin-bottom: 20px;
            color: #ffffff;
        }

        p {
            font-size: clamp(16px, 2.5vw, 18px);
            color: #b0b0b0;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 16px 32px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            transition: all 300ms ease;
            font-size: 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            color: #0a0a0a;
            box-shadow: 0 10px 40px rgba(255, 107, 107, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(255, 107, 107, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }

        .graphic {
            margin-bottom: 40px;
            position: relative;
            height: 200px;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .circle-1 {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.3), rgba(255, 217, 61, 0.1));
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(40px);
        }

        .circle-2 {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(107, 207, 127, 0.3), rgba(255, 217, 61, 0.1));
            bottom: 0;
            left: 20%;
            filter: blur(40px);
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (max-width: 480px) {
            .button-group {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="graphic" aria-hidden="true">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
        </div>

        <div class="error-code" aria-label="Error 404">404</div>
        <h1>Page Not Found</h1>
        <p>
            The page you're looking for doesn't exist or has been moved.
            Let's get you back on track.
        </p>

        <div class="button-group">
            <a href="/" class="btn btn-primary">Go Home</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>
    </div>
</body>
</html>
